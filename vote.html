<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Voting</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav><a href="index.html">← Home</a></nav>

  <section class="card">
    <h1>Live Audience Vote</h1>
    <p>Choose who won the crowd.</p>

    <div class="vote-grid">
      <button onclick="vote('alpha')" class="alpha">Vote Team Alpha</button>
      <button onclick="vote('que')" class="que">Vote Team Que</button>
    </div>

    <h2>Results</h2>
    <p>Team Alpha: <span id="alphaVotes">0</span></p>
    <p>Team Que: <span id="queVotes">0</span></p>

    <div class="bar">
      <div id="alphaBar"></div>
      <div id="queBar"></div>
    </div>

    <p id="message"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
