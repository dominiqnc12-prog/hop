<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Controls | Hop vs Stroll</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .admin-page {
      min-height: 100vh;
      padding: 40px 20px;
    }

    .admin-card {
      width: min(92%, 700px);
      margin: 40px auto;
    }

    .admin-status {
      display: grid;
      gap: 20px;
      margin-top: 30px;
    }

    .control-panel {
      padding: 22px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .status {
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .status.open {
      color: #70e69b;
    }

    .status.closed {
      color: #ff6b6b;
    }

    .admin-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .admin-buttons button {
      width: auto;
      min-width: 160px;
    }

    .danger-btn {
      background: linear-gradient(135deg, #6d1212, #a51d1d);
    }

    .success-btn {
      background: linear-gradient(135deg, #174d2c, #218c4d);
    }

    #loginScreen {
      text-align: center;
    }

    #adminControls {
      display: none;
    }

    .password-input {
      width: 100%;
      max-width: 340px;
      padding: 14px 16px;
      margin: 15px 0;

      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);

      background: #111;
      color: #fff;

      font-size: 1rem;
    }

    .password-input:focus {
      outline: 2px solid var(--alpha-gold-bright);
      outline-offset: 2px;
    }

    #loginMessage,
    #adminMessage {
      margin-top: 16px;
      color: var(--text-secondary);
    }
  </style>
</head>

<body>

  <div class="admin-page">

    <nav>
      <a href="index.html">
        <span>← Home</span>
      </a>
    </nav>

    <main class="card admin-card">

      <!-- PASSCODE SCREEN -->
      <section id="loginScreen">

        <h1>Admin Access</h1>

        <p>
          Enter the event admin passcode.
        </p>

        <input
          id="passwordInput"
          class="password-input"
          type="password"
          placeholder="Admin passcode"
          autocomplete="off"
        />

        <div class="buttons">
          <button
            class="register-btn"
            onclick="checkPassword()"
          >
            <span>Enter Admin</span>
          </button>
        </div>

        <p id="loginMessage"></p>

      </section>


      <!-- ADMIN CONTROLS -->
      <section id="adminControls">

        <h1>Event Controls</h1>

        <p>
          Control live voting and ticket availability.
        </p>


        <div class="admin-status">

          <!-- VOTING -->
          <div class="control-panel">

            <div class="status-line">
              <div>
                <strong>Audience Voting</strong>
              </div>

              <span
                id="votingStatus"
                class="status"
              >
                CHECKING...
              </span>
            </div>

            <div class="admin-buttons">

              <button
                class="danger-btn"
                onclick="setVoting(false)"
              >
                <span>Lock Voting</span>
              </button>

              <button
                class="success-btn"
                onclick="setVoting(true)"
              >
                <span>Unlock Voting</span>
              </button>

            </div>

          </div>


          <!-- TICKETS -->
          <div class="control-panel">

            <div class="status-line">
              <div>
                <strong>Ticket Sales</strong>
              </div>

              <span
                id="ticketStatus"
                class="status"
              >
                CHECKING...
              </span>
            </div>

            <div class="admin-buttons">

              <button
                class="danger-btn"
                onclick="setTickets(false)"
              >
                <span>Lock Tickets</span>
              </button>

              <button
                class="success-btn"
                onclick="setTickets(true)"
              >
                <span>Unlock Tickets</span>
              </button>

            </div>

          </div>

        </div>

        <p id="adminMessage"></p>

      </section>

    </main>

  </div>


  <script>

    /*
     * Change this to whatever passcode
     * you want to use.
     */
    const ADMIN_PASSWORD = "AlphaQue2026";


    /*
     * We will replace this with your
     * Google Apps Script URL.
     */
    const CONTROL_API_URL =
      "https://script.google.com/macros/s/AKfycbyYicE7emly5EnrJzWaYIEL2A--CyO3lnQBX6h3Ax4s52wzLYTvyHmy8dr-Kr59sAAZ/exec";


    function checkPassword() {

      const enteredPassword =
        document
          .getElementById("passwordInput")
          .value;

      const loginMessage =
        document.getElementById(
          "loginMessage"
        );


      if (
        enteredPassword ===
        ADMIN_PASSWORD
      ) {

        document.getElementById(
          "loginScreen"
        ).style.display =
          "none";


        document.getElementById(
          "adminControls"
        ).style.display =
          "block";


        loadStatus();

      } else {

        loginMessage.textContent =
          "Incorrect passcode.";

      }

    }


    /*
     * Allow Enter key to submit password.
     */

    document
      .getElementById("passwordInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {
            checkPassword();
          }

        }
      );


    /*
     * LOAD CURRENT EVENT STATUS
     */

    async function loadStatus() {

      try {

        const response =
          await fetch(
            CONTROL_API_URL +
            "?action=status&t=" +
            Date.now()
          );


        const data =
          await response.json();


        updateStatusDisplay(
          data.votingOpen,
          data.ticketsOpen
        );


      } catch (error) {

        console.error(error);

        document.getElementById(
          "adminMessage"
        ).textContent =
          "Unable to connect to event controls.";

      }

    }


    /*
     * LOCK / UNLOCK VOTING
     */

    async function setVoting(isOpen) {

      setMessage(
        isOpen
          ? "Opening voting..."
          : "Locking voting..."
      );


      try {

        const response =
          await fetch(
            CONTROL_API_URL +
            "?action=setVoting" +
            "&open=" +
            isOpen +
            "&t=" +
            Date.now()
          );


        const data =
          await response.json();


        updateStatusDisplay(
          data.votingOpen,
          data.ticketsOpen
        );


        setMessage(
          isOpen
            ? "Voting is now OPEN."
            : "Voting is now LOCKED."
        );


      } catch (error) {

        console.error(error);

        setMessage(
          "Unable to update voting."
        );

      }

    }


    /*
     * LOCK / UNLOCK TICKETS
     */

    async function setTickets(isOpen) {

      setMessage(
        isOpen
          ? "Opening ticket sales..."
          : "Locking ticket sales..."
      );


      try {

        const response =
          await fetch(
            CONTROL_API_URL +
            "?action=setTickets" +
            "&open=" +
            isOpen +
            "&t=" +
            Date.now()
          );


        const data =
          await response.json();


        updateStatusDisplay(
          data.votingOpen,
          data.ticketsOpen
        );


        setMessage(
          isOpen
            ? "Ticket sales are now OPEN."
            : "Ticket sales are now LOCKED."
        );


      } catch (error) {

        console.error(error);

        setMessage(
          "Unable to update ticket sales."
        );

      }

    }


    /*
     * UPDATE SCREEN
     */

    function updateStatusDisplay(
      votingOpen,
      ticketsOpen
    ) {

      const votingStatus =
        document.getElementById(
          "votingStatus"
        );

      const ticketStatus =
        document.getElementById(
          "ticketStatus"
        );


      votingStatus.textContent =
        votingOpen
          ? "OPEN"
          : "LOCKED";


      votingStatus.className =
        votingOpen
          ? "status open"
          : "status closed";


      ticketStatus.textContent =
        ticketsOpen
          ? "OPEN"
          : "LOCKED";


      ticketStatus.className =
        ticketsOpen
          ? "status open"
          : "status closed";

    }


    function setMessage(message) {

      document.getElementById(
        "adminMessage"
      ).textContent =
        message;

    }

  </script>

</body>
</html>
```
